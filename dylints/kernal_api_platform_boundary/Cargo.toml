[package]
name = "kernal_api_platform_boundary"
version = "0.1.0"
description = "Keep client host-platform selection inside kernal-api"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.2.0"
proc-macro2 = { version = "=1.0.106", default-features = false, features = ["span-locations"] }

[dev-dependencies]
dylint_testing = "=6.2.0"
serde_json = "1"

[package.metadata.rust-analyzer]
rustc_private = true

# Warnings are errors here, as in the kernal-api workspace.
[lints.rust]
warnings = "deny"

[workspace]

[profile.release]
opt-level = 0
lto = false
codegen-units = 16
strip = "none"
