# ci.toml -- kernal-api's CI contract, checked by ci-lint (zackees/ci.yml, schema 3).
# Nothing here generates YAML: it describes what .github/workflows/ci.yml already
# does so `ci-lint precheck` can bound it. Phase 2 of zackees/ci.yml#37; the
# first slice only declares the real shape -- findings that the YAML does not
# yet meet this contract are tracked in zackees/ci.yml, not silenced here.
schema  = 3
profile = "rust-library"                          # a Rust facade crate + a hatchling Python package; not a native-CLI PyPI app
linter  = "zackees/ci.yml@54cec7ad3ac5c7b9866a1798b863c21e68936d60"

# -- Platforms: the six hosts `linux` + `test` (x5) run on --------------------
[platforms]
linux-x64     = { target = "x86_64-unknown-linux-gnu",  runs-on = "ubuntu-24.04",     group = "linux" }
linux-arm64   = { target = "aarch64-unknown-linux-gnu", runs-on = "ubuntu-24.04-arm", group = "linux" }
windows-x64   = { target = "x86_64-pc-windows-msvc",    runs-on = "windows-2025",     group = "windows" }
windows-arm64 = { target = "aarch64-pc-windows-msvc",   runs-on = "windows-11-arm",   group = "windows" }
macos-arm64   = { target = "aarch64-apple-darwin",      runs-on = "macos-15",         group = "macos" }
macos-x64     = { target = "x86_64-apple-darwin",       runs-on = "macos-15-intel",   group = "macos" }

# -- Rust (§12): one public crate, no private crates yet ----------------------
# AGENTS.md: private crates only when measured Soldr/Cargo timings justify them.
[rust]
public  = "."
private = "crates/private/*"                      # none exist yet; the future home per AGENTS.md
public-role = "library"                         # the public crate IS the implementation, no amalgam yet (RUST-011, ci.yml#95)
ship    = [["default"]]                           # the default facade (`default = []`); the all-features graph is a finding (ci.yml#37)

[rust.tests]
max-binary = "250MB"                              # AGENTS.md: ~180 MB per linked test binary
max-total  = "700MB"                              # AGENTS.md: 619 MB for the category layout
# One harness per tests/<category>/main.rs plus the three top-level binaries
# AGENTS.md justifies (process-global state / shipped by name to native hosts).
binaries = [
  "kernal-api:lib",
  "kernal-api:test:daemon",
  "kernal-api:test:data",
  "kernal-api:test:diagnostics",
  "kernal-api:test:fs",
  "kernal-api:test:net",
  "kernal-api:test:process",
  "kernal-api:test:source_policy",
  "kernal-api:test:terminal",
  "kernal-api:test:wasm",
  "kernal-api:test:allocator_heap_profile",
  "kernal-api:test:wasm_tauri_screenshot",
  "kernal-api:test:wasm_worker_containment",
  "kernal-api:bin:kernal-symbolize",
  "kernal-api:bin:kernal-wasm-worker",
  "kernal-api:bin:kernal-tauri-smoke",
  "kernal-api:bin:kernal-api-wasm-tauri",
]

[lint.dylint]
targets = "all-platforms"
shape   = "measure"                               # `dylints` job; not yet measured against multi-target
budget  = { warm = "300s", cold = "900s" }        # unverified placeholders -- see ci.yml#37 case study

# -- Suites --------------------------------------------------------------------
[suites]
unit   = { run = "soldr cargo test", required = true }              # `linux` job: default facade + full suite
python = { run = "uv run --no-project ci/test_ci_modes.py" }        # `linux` job: CI/Python guards
native = { run = "ci/native_proof.py" }                             # `test` (x5): prebuilt archives + native proofs

# -- Flows (mirrors ci/ci_mode.py: minimal / ci-test / ci-full) ---------------
[flow.pr]
platforms = ["linux-x64"]
suites    = ["unit", "python"]
dylint    = "all-platforms"

[flow.main]
extends = "pr"
cache   = "write"

[tags]
ci-full = { add = { platforms = "all", suites = ["native"] } }
ci-test = { add = { suites = ["native"] } }

# -- Caches: what main writes (zackees/ci.yml#93) --------------------------------
# A main push runs minimal mode (ci/ci_mode.py): only `linux` and `dylints`, both
# on ubuntu-24.04 x64, and the ci-lint plan's cache_save is true only there. Full
# mode (ci-full PRs, dispatched candidate SHAs) restores but never saves remotely; the
# release and nightly macOS lanes pass global save-cache "false". The shared
# action owns automatic local saves; remote write permission stays plan-driven.
# So every family below
# has exactly one writer shape, on linux-x64: per = "none". The cross-target
# build-cache, prepared-SDK and cargo-registry entries on main came from an older
# policy that saved from full-mode runs; nothing writes them now, so they are not
# declared, and `ci-lint cache janitor` retires them as undeclared.
# Sizes: measured on main 2026-09-29 (largest live entry), rounded up.
[cache]
budget   = "9.5GB"                                # ci/prune_obsolete_cook_caches.py BUDGET_BYTES
write-on = ["main"]
never    = ["linked-tests", "nextest-archives", "target-dir"]
pr       = { mode = "none", families = [], max-per-pr = "0MB", budget = "0MB", trim = "on-close" }   # PRs never save

[cache.family]
# `dylint` and `dylint-out` carry `evict = "lru"` (CACHE-029): their keys
# embed a per-run hash, so without it every run appends an entry nothing
# retires. Measured 2026-10-04: 13 live `dylint` entries (7.6 GB) and 11
# `dylint-out` (7.0 GB), 87% of this repository's cache superseded, at
# 98.8% of the 10 GB budget -- new saves were being refused and pull
# requests ran cold. `max` sizes ONE entry and cannot bound the family;
# `per` declares the writer shape, not the entry count.
deps         = { via = "setup-soldr:cook",           max = "150MB",  lockfile = true, per = "none" }             # linux cook base, 127,235,799 B
compile      = { via = "setup-soldr:build-cache",    max = "150MB",  lockfile = true, per = "none", min = "1MB" } # linux thin (ci-tests) build cache, 89,412,879 B
toolchain    = { via = "setup-soldr:solo-toolchain", max = "210MB",  per = "none" }                              # linux-x64 tnone, 179,728,890 B
dylint       = { via = "setup-soldr:dylint",         max = "600MB",  per = "none", min = "1MB", evict = "lru", promote = "ancestor" }   # 544,405,988 B
dylint-out   = { via = "setup-soldr:dylint-output",  max = "700MB",  lockfile = true, per = "none", min = "1MB", evict = "lru", promote = "ancestor" } # 619,590,808 B
soldr-mini   = { via = "setup-soldr:soldr-mini",     max = "15MB",   per = "none", min = "1MB" }                 # linux-x64, 10,727,008 B
uv           = { via = "setup-uv",                   max = "5MB",    per = "none" }                              # linux-x64, <= 1,474,015 B
# setup-soldr's lint verdict markers (fmt/clippy/dylint pass records): tiny,
# content-addressed, one per checked input. Undeclared, the janitor deletes
# every one (CACHE-001) and each run re-saves them. `min` replaces the 1 KB
# poison floor; LRU keeps the family under 1 MB.
soldr-verdict = { prefix = "soldr-verdict-",         max = "1MB",    per = "none", min = "100B", evict = "lru" } # 20 entries, 9,939 B


# Promotion (CACHE-024, zackees/ci.yml#335). #335 standardizes promotion on
# setup-soldr's ancestor encoding -- shortest parent-edge distance from a live
# git DAG walk -- rather than a first-parent ordinal, which inverts on wide
# merges (a 50-commit branch tip reports ordinal 53 while the merge commit
# containing it reports 4). #335 keeps the `m<n>` label for offline audit only.
#
# Declaring the mode opts each family below into the LINEAGE LABEL that makes a
# nearest-ancestor search decidable; a key ending in a bare content hash
# destroys the ancestry at save time (CACHE-031). dylint (600MB) and dylint-out
# (700MB) are the two families at or above CACHE-031's 256MB floor, and they are
# what held this repository's budget -- 87% of its entries were superseded
# before the janitor work. Both now also carry evict = "lru" (#421).
#
# A declaration only: setup-soldr#566 is merged but unreleased (no tag contains
# it; v0.9.85 predates it; the sanctioned v0 float trails main), so CACHE-030
# and CACHE-032 report `needs_review` and the opt-in is inert until a release
# carries it.
[cache.promote]
mode          = "ancestor"
max-age-hours = 168
[local]
runner = "bosn-act"
lanes  = ["precheck"]
cache  = "machine"

# First rollout lane: the exact remote minimal Linux job in bosn/act2.
# Remote jobs keep running until verifier wiring and coverage are validated.
[local.gate]
run = ["uv", "run", "--no-project", "--with", "ci-lint @ git+https://github.com/forge-ci/ci.yml@54cec7ad3ac5c7b9866a1798b863c21e68936d60", "--python", "3.12", "python", "ci/local_gate.py"]
# Owner directive 2026-10-28: a missing Local-Gate attestation costs CI time,
# not a red PR. Shadow is ci.yml 54cec7ad's default; this repository now
# follows it instead of opting into enforce (forge-ci/kernal-api#501 was
# blocked by [GATE-003] before any job ran).
mode = "shadow"
verify = "ci.yml:verify"

[local.gate.lanes.linux-minimal]
run = ["uv", "run", "--no-project", "--with", "ci-lint @ git+https://github.com/forge-ci/ci.yml@54cec7ad3ac5c7b9866a1798b863c21e68936d60", "--python", "3.12", "python", "ci/local_gate.py"]
tools = ["bosn", "uv"]

[local.gate.lanes.dylint-minimal]
run = ["uv", "run", "--no-project", "--with", "ci-lint @ git+https://github.com/forge-ci/ci.yml@54cec7ad3ac5c7b9866a1798b863c21e68936d60", "--python", "3.12", "python", "ci/local_gate.py", "--job", "dylints"]
tools = ["bosn", "uv"]

# Eligible attested minimal PRs reuse both source-bound workflow lanes.
# Extended/full PRs, changed gate surfaces, pushes and audit samples run remotely.
[local.gate.trust]
mode = "enforce"
skip = ["ci.yml:linux", "ci.yml:dylints"]
covered-by = { "ci.yml:linux" = ["linux-minimal"], "ci.yml:dylints" = ["dylint-minimal"] }
full-labels = ["ci-full", "ci-test"]
audit-rate = 10

[local.gate.replay]
repository = "forge-ci/kernal-api"
# bosn names the repository after the checkout's origin URL; checkouts made
# before the move still say zackees (#436).
repository-aliases = ["zackees/kernal-api"]
# Match jobs by their qualified identity (`jobID` + matrix), which current bosn
# reports, rather than by display key.
qualified = true
workflow = "ci.yml"
mode = "minimal"

[[local.gate.replay.jobs]]
source-job = "ci.yml:verify"
key = "CI/verify"
steps = ["Checkout candidate source", "Checkout pinned ci-lint", "Set up uv", "Verify local gate attestation"]
lanes = ["linux-minimal", "dylint-minimal"]

[[local.gate.replay.jobs]]
source-job = "ci.yml:linux"
key = "CI/linux"
steps = ["Checkout candidate source", "Set up uv", "Select CI mode and verify the checked-out commit", "Verify selected source SHA", "Checkout pinned ci-lint", "Plan this run with the pinned ci-lint", "Precheck the repository with the pinned ci-lint", "Install native webview packages and a virtual display", "Set up soldr", "Restore native pkg-config search path", "Check workspace formatting", "Check Python function complexity", "Check the CI guards and the guest build scripts", "Scan the repository against the platform boundary", "Check the Dylint libraries' formatting", "Lint the default facade", "Test the default facade", "Test the Linux desktop status facade", "Test the full Linux desktop status facade", "Check the compilation boundary and the release tooling", "Test the Python package", "Verify checked-in guest, host, and ABI manifest generation", "Check every feature in isolation", "Test JSON with unified arbitrary-precision backend feature", "Verify HTTP wire semantics under backend feature unification", "Check the external facade consumers", "Run real semantic webview lifecycle and capture proofs", "Install the screenshot guest target", "Build, admit, and run the real guest through the default screenshot CLI", "Build the target-independent Wasm guests once", "Upload target-independent Wasm guests", "Compile the x86_64 Linux native proofs", "Run the x86_64 Linux compiler-policy proofs", "Run the x86_64 Linux screenshot and containment proofs", "Lint every target", "Run the full test suite", "Preserve screenshot and process diagnostics", "Cancel the run (this job failed)"]
lanes = ["linux-minimal"]
minimal-skip-steps = ["Install native webview packages and a virtual display", "Test the full Linux desktop status facade", "Check the compilation boundary and the release tooling", "Test the Python package", "Verify checked-in guest, host, and ABI manifest generation", "Check every feature in isolation", "Test JSON with unified arbitrary-precision backend feature", "Verify HTTP wire semantics under backend feature unification", "Check the external facade consumers", "Run real semantic webview lifecycle and capture proofs", "Install the screenshot guest target", "Build, admit, and run the real guest through the default screenshot CLI", "Build the target-independent Wasm guests once", "Upload target-independent Wasm guests", "Compile the x86_64 Linux native proofs", "Run the x86_64 Linux compiler-policy proofs", "Run the x86_64 Linux screenshot and containment proofs", "Lint every target", "Run the full test suite", "Preserve screenshot and process diagnostics", "Cancel the run (this job failed)"]
minimal-mode-step = "Select CI mode and verify the checked-out commit"

[[local.gate.replay.jobs]]
source-job = "ci.yml:dylints"
key = "CI/Dylint workspace"
steps = ["Checkout candidate source", "Start installing native webview development packages", "Set up uv", "Select CI mode and verify the checked-out commit", "Verify selected source SHA", "Checkout pinned ci-lint", "Plan this run with the pinned ci-lint", "Set up soldr", "Restore native pkg-config search path", "Select the pinned Dylint compiler", "Decide whether the lint libraries need their own tests", "Finish installing native webview development packages", "Verify nightly checksum invalidation", "Lint every client-style target", "Cancel the run (this job failed)"]
lanes = ["dylint-minimal"]
minimal-skip-steps = ["Cancel the run (this job failed)"]
minimal-mode-step = "Select CI mode and verify the checked-out commit"

[[local.gate.replay.selections]]
lane = "linux-minimal"
job = "linux"
event = "pull_request"
inputs = {}

[[local.gate.replay.selections]]
lane = "dylint-minimal"
job = "dylints"
event = "pull_request"
inputs = {}

[allow]
workflows = { "ci.yml" = ["pull_request", "push:main", "workflow_dispatch", "merge_group"], "auto-release.yml" = ["workflow_dispatch"], "release.yml" = ["workflow_call"], "macos-x64-tests.yml" = ["schedule", "workflow_dispatch"] }
actions   = ["actions/checkout", "actions/upload-artifact", "actions/download-artifact", "astral-sh/setup-uv", "zackees/setup-soldr", "zackees/docker-mac-x64", "rust-lang/crates-io-auth-action"]
tools     = ["soldr", "uv", "git", "jq", "sudo"]
secrets   = ["PYPI_API_TOKEN"]                    # a finding against the OIDC-only policy (SEC-005), declared rather than hidden
# The one setup-soldr call site; its remote permission passes through the ci-lint plan's
# cache_save (true only on a main push) from every caller.
setup-soldr = { only-in = ".github/actions/soldr", require = { cook-delta = "false", save-cache-remote = "plan" } }
setup-uv    = { require = { save-cache = "plan" } }
# Workflow defaults are read-only; these jobs grant themselves more. `actions: write`
# = the "Cancel the run" step (and cache-retention's deletes); the auto-release
# `release` call passes both writes down to release.yml, whose release-assets job
# creates the GitHub release; publish-crates mints crates.io's OIDC token.
permissions = { "actions: write" = ["linux", "build", "test", "dylints", "cache-retention", "cache-janitor", "release", "release-guard", "validate-and-package", "symbolizer-workers", "publish-pypi", "release-assets", "publish-crates"], "contents: write" = ["release", "release-assets"], "id-token: write" = ["publish-crates"], "pull-requests: read" = ["verify"] }
platform-selector = "src/lib.rs"
# The CI host-facts facade owns Python host queries for GATE-011 fidelity;
# callers consume its typed record. Production Rust selectors remain confined
# to the concrete trees below (LAYOUT-001).
platform-code     = ["src/platform_win*.rs", "src/platform_win/**", "src/platform_linux*.rs", "src/platform_linux/**", "src/platform_macos*.rs", "src/platform_macos/**", "ci/platform_host.py",
                     # native modules included only via #[path] from the platform trees
                     "src/sync_spawn_group.rs", "src/tests/platform_linux_coverage.rs"]

[publish]
pypi = { auth = "token", environment = "release", mode = "real" }

# -- GEN-005: the one shell script that cannot be Python (forge-ci/ci.yml#94) --------
# Every other tracked .sh/.ps1 moved to ci/*.py. This one is the payload a macOS
# Recovery guest executes: Recovery ships bash 3.2 and no Python, Rust toolchain,
# Xcode CLT or Homebrew, and boots exactly one script. ci/test_macos_x64_guest.py
# pins it bash-3.2-compatible; ci/macos-x64/verify-guest-results.py decides the verdict.
[[exceptions]]
rule    = "GEN-005"
path    = "ci/macos-x64/recovery-guest.sh"
reason  = "executed inside a macOS Recovery guest (bash 3.2, no Python interpreter), not on a runner"
issue   = "https://github.com/forge-ci/ci.yml/issues/94"
expires = "2027-06-30"

# -- GEN-021: validation skips main pushes under a live merge queue -----------
# GEN-022 step 6 (forge-ci/ci.yml#432). `fast`, `linux` and `dylints` carry
# `github.event_name != 'push'`: the `main merge queue` ruleset requires
# verify/linux/Dylint workspace on the `merge_group` run, which validates the
# exact merge commit that lands (policy-general.md: the queue is the one other
# justification for a blanket push skip). Main's cache writes moved to the
# push-only `linux-cache-writer`/`dylint-cache-writer` jobs first (step 5).
[[exceptions]]
rule    = "GEN-021"
path    = ".github/workflows/ci.yml"
reason  = "merge queue validates the exact merge commit (merge_group runs verify/linux/Dylint workspace); push runs only the cache writers"
issue   = "https://github.com/forge-ci/ci.yml/issues/432"
expires = "2027-04-30"

