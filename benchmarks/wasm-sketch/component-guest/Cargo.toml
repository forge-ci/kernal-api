[package]
name = "kernal-component-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

# Warnings are errors here, as in the kernal-api workspace.
[lints.rust]
warnings = "deny"

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
compiler-proof = ["kernal-api/wasm-component-compiler-experiment"]
lowering-trap-proof = ["kernal-api/wasm-component-compiler-experiment"]
# Declared only because the shared policy is compiled by both candidates. The
# Component WIT world does not expose exact output, so this remains disabled.
compiler-artifact-output = []

[dependencies]
zccache-compiler = { git = "https://github.com/zackees/zccache", rev = "c6ddfa974a4920a127eac81773db6a5c56cd30a7", default-features = false }
# Exact source-only migration fixture; not published-pin acceptance.
zccache-hash = { git = "https://github.com/zackees/zccache", rev = "2543136ea8b648b295d2f7115a19656ff0854531", default-features = false }
kernal-api = { version = "=0.1.36", path = "../../..", default-features = false, features = ["wasm-component-hash-experiment"] }
wit-bindgen = { version = "=0.58.0", default-features = false, features = ["macros", "realloc", "async", "std"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
