name: soldr setup
description: >-
  The only `zackees/setup-soldr` call site in this repository (ci.toml
  [allow].setup-soldr.only-in; ci-lint CACHE-009/RUST-001). It fixes the
  inputs every job must share -- one Soldr runtime version and no cook-delta
  layer -- and takes `save-cache-remote` from the ci-lint plan, so a job cannot
  write a durable cache outside the flows ci.toml [cache].write-on names.
  ci/test_cache_policy.py checks every caller.

inputs:
  save-cache:
    description: >-
      Global write policy. Explicit "false" disables every save, including
      local execution; release and nightly guest lanes retain that disable.
      Ordinary CI leaves "auto" so the shared action can save locally.
    required: false
    default: "auto"
  save-cache-remote:
    description: >-
      The ci-lint plan's cache_save output: "true" on a main push, "false"
      on pull requests and dispatched runs. Applies only to remote writes;
      the shared action owns local automatic saves under act/act2.
    required: false
    default: "auto"
  cache-key-pr:
    description: >-
      The ci-lint plan's cache_key_pr output: "pr-N" on a pull request and
      empty everywhere else. It is appended to cache-key-suffix only when
      this step saves, so a PR-context save carries its PR number
      (ci-lint CACHE-013) and the janitor can delete it after the PR closes.
    required: false
    default: ""
  cache-key-suffix:
    description: Forwarded to setup-soldr. It is part of the cook-base key.
    required: false
    default: ""
  ci-tests:
    description: Forwarded to setup-soldr.
    required: false
    default: "false"
  cache:
    description: Forwarded to setup-soldr (the umbrella restore/save switch).
    required: false
    default: "true"
  build-cache:
    description: Forwarded to setup-soldr.
    required: false
    default: ""
  cargo-registry-cache:
    description: Forwarded to setup-soldr.
    required: false
    default: ""
  solo-toolchain-cache:
    description: Forwarded to setup-soldr.
    required: false
    default: "true"
  prebuild-deps:
    description: Forwarded to setup-soldr.
    required: false
    default: "soldr-cook"
  prebuild-deps-flags:
    description: >-
      Forwarded to setup-soldr. It must match the profile the job compiles,
      or the cook base is never reused.
    required: false
    default: "--release"
  cross-targets:
    description: Forwarded to setup-soldr.
    required: false
    default: ""
  toolchain:
    description: Forwarded to setup-soldr. Empty reads rust-toolchain.toml.
    required: false
    default: ""
  dylint:
    description: Forwarded to setup-soldr.
    required: false
    default: "false"
  dylint-toolchain:
    description: Forwarded to setup-soldr.
    required: false
    default: ""
  cargo-dylint-version:
    description: Forwarded to setup-soldr.
    required: false
    default: "6.2.0"
  dylint-link-version:
    description: Forwarded to setup-soldr.
    required: false
    default: "6.2.0"

outputs:
  soldr-version:
    description: The Soldr runtime version setup-soldr installed.
    value: ${{ steps.setup.outputs.soldr-version }}

runs:
  using: composite
  steps:
    - uses: zackees/setup-soldr@v0 # v0.9.82 or later (floating major)
      id: setup
      with:
        # PINNED, not floating: soldr 0.9.47 (setup-soldr's current default)
        # fetches a cargo-nextest built for rustc 1.98.1 on jobs whose pinned
        # toolchain is 1.95.0, and `soldr cargo nextest --version` then exits 1
        # on the cross-target Build jobs -- which fails the full-CI candidate
        # dispatch the release gate requires (0.1.36 could not publish).
        # 0.9.44 is the runtime that passed the 0.1.35 gate. Revert this line to
        # the floating default once the soldr issue is fixed.
        version: 0.9.44
        # Otherwise every job takes setup-soldr's default Soldr runtime, the one
        # soldr pin (bumped by setup-soldr per release). `@v0` moves only
        # through setup-soldr's gated promotion, so every step in a run resolves
        # the same default -- one runtime, one cache generation.
        cook-delta: false # per-commit delta layer off (setup-soldr#528)
        save-cache: ${{ inputs.save-cache }}
        save-cache-remote: ${{ inputs.save-cache-remote }}
        cache-key-suffix: ${{ inputs.save-cache-remote == 'true' && inputs.cache-key-pr != '' && (inputs.cache-key-suffix != '' && format('{0}-{1}', inputs.cache-key-suffix, inputs.cache-key-pr) || inputs.cache-key-pr) || inputs.cache-key-suffix }}
        ci-tests: ${{ inputs.ci-tests }}
        cache: ${{ inputs.cache }}
        build-cache: ${{ inputs.build-cache }}
        cargo-registry-cache: ${{ inputs.cargo-registry-cache }}
        solo-toolchain-cache: ${{ inputs.solo-toolchain-cache }}
        prebuild-deps: ${{ inputs.prebuild-deps }}
        prebuild-deps-flags: ${{ inputs.prebuild-deps-flags }}
        cross-targets: ${{ inputs.cross-targets }}
        toolchain: ${{ inputs.toolchain }}
        dylint: ${{ inputs.dylint }}
        dylint-toolchain: ${{ inputs.dylint-toolchain }}
        cargo-dylint-version: ${{ inputs.cargo-dylint-version }}
        dylint-link-version: ${{ inputs.dylint-link-version }}
