name: CI

on:
  pull_request:
    # `edited`: a title-only tag edit re-selects the run (ci-lint TAG-003).
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  # Retain a deterministic recovery path when GitHub drops or delays a
  # pull-request synchronize event for a draft branch. Manual dispatch runs
  # the exact same matrix at the explicitly selected ref.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to validate with the complete matrix
        required: true
        type: string
  push:
    branches: [main]
  # GEN-022 (forge-ci/ci.yml#405): main merges through a merge queue, which
  # validates the exact merge commit. A queue run selects the push tier.
  merge_group:
    types: [checks_requested]

# One live run per workflow per ref, main included: a new push cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Main used to be exempt through a `github.run_id` group, which kept a CI
# record for every main commit -- at the cost of a full matrix per commit even
# when the next push landed seconds later. Two pushes four seconds apart held
# nine runners in `reld` while unrelated PRs queued. A superseded main commit
# now has no run of its own; its content is covered by the run for the commit
# that replaced it.
#
# Main pushes no longer cancel (CACHE-016): main is the only writer of the
# must-hit Dylint cache, and a cancelled run loses its save, so every PR misses.
# The merge queue (GEN-022) lands one PR at a time, so main pushes rarely
# overlap; a later one waits, and GitHub drops an older *pending* run itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default (ci-lint SEC-002). Each job whose last step cancels
# the run on failure grants itself `actions: write`; ci.toml's
# [allow].permissions lists exactly those jobs.
permissions:
  contents: read
  actions: read

jobs:
  # Require source-bound local proof before PR execution. Eligible minimal
  # PRs reuse their attested lanes; the base policy fails closed and keeps
  # pushes, full/test labels, changed gate surfaces and audit samples remote.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # A source-bound attestation on a PR (GATE-008/010) skips a whole job.
      skip_linux: ${{ steps.gate.outputs.skip_linux }}
      skip_dylints: ${{ steps.gate.outputs.skip_dylints }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned ci-lint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zackees/ci.yml
          ref: 54cec7ad3ac5c7b9866a1798b863c21e68936d60
          path: .ci-lint
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          # verify runs before any plan exists; save on main pushes only
          # (CACHE-003) and tag PR keys pr-<N> for the janitor (CACHE-013).
          save-cache: ${{ github.event_name == 'push' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Verify local gate attestation
        id: gate
        env:
          PYTHONPATH: .ci-lint
        run: uv run --no-project --python 3.12 python -m ci_lint local-gate verify --repo . --trust --github-output

  # GEN-004: Ruff check, Ruff format --check and Pylint over every tracked
  # Python file, on one small runner beside `linux`. Compiles nothing.
  fast:
    name: Python lint
    needs: verify
    # GEN-022 step 6 (forge-ci/ci.yml#432): the merge queue linted the tree
    # that lands, so a main push does not lint it again.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # Only a main push saves (ci.toml [cache].write-on); PR keys carry pr-<N>.
          save-cache: ${{ github.event_name == 'push' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Ruff check
        run: uv run --no-project --with ruff==0.16.7 ruff check .
      - name: Ruff format check
        run: uv run --no-project --with ruff==0.16.7 ruff format --check .
      - name: Pylint
        env:
          # `from ci import ...` resolves against the checkout root.
          PYTHONPATH: .
        run: uv run --no-project --with pylint==4.0.9 pylint --recursive=y .

  # Four work jobs set up once and do everything that belongs on each runner.
  # Full mode adds one small coverage sentinel after those jobs finish.
  #
  #   linux          the gate: every Linux-only check and proof, then lint,
  #                  the full test suite, and the Wasm guests the hosts replay
  #   build (x5)     one Linux builder per other target: archive + proofs
  #   test (x5)      one host per other target: run what was built, compile nothing
  #   dylints (x2)   the boundary lints, on their own pinned nightly in every mode
  # Each job's last step cancels the run when that job fails (pull requests).
  #
  # This replaced 20 job definitions and 52 runners per push. Checks that used
  # to be a job each are now steps; the per-target proof matrices
  # (`native-proof-build`, `wasm-compiler-native`, `wasm-tauri-screenshot-native`)
  # folded into `build` and `test`, which already had one runner per target;
  # `supported-targets` compiled the same all-feature graph `build` archives,
  # so only its ABI-generator cross-check survived, as a `build` step.

  # Linux goes first and gates every other target. It compiles the same
  # sources they do, so a failure here is a failure everywhere, and holding
  # Apple and Windows runners to rediscover it is the waste this ordering
  # removes. On Linux the builder is the host, so everything runs in place,
  # on one runner: the Linux-only checks first, then lint and the full suite.
  linux:
    needs: verify
    # GEN-022 step 6 (forge-ci/ci.yml#432): a main push skips validation; the
    # merge queue proved the tree, and `linux-cache-writer` owns main's saves.
    if: needs.verify.outputs.skip_linux != 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      sha: ${{ steps.mode.outputs.sha }}
      soldr_version: ${{ steps.setup_soldr.outputs.soldr-version }}
      cache_save: ${{ steps.plan.outputs.cache_save }}
      cache_key_pr: ${{ steps.plan.outputs.cache_key_pr }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # Before the plan exists: only a main push saves (ci.toml [cache].write-on).
          save-cache: ${{ github.event_name == 'push' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Select CI mode and verify the checked-out commit
        id: mode
        run: uv run --no-project --python 3.12 ci/ci_mode.py
      - name: Verify selected source SHA
        run: python3 ci/verify_source_sha.py "${{ steps.mode.outputs.sha }}"
      # ci.toml is the fleet CI contract (zackees/ci.yml#37), pinned to the
      # exact ci-lint commit its `linter` key names. `plan` strictly loads it,
      # prints this run's selection, and decides whether this run writes
      # caches (`cache_save`: main pushes only, ci.toml [cache].write-on) --
      # the remote write permission every setup-soldr and setup-uv step takes.
      - name: Checkout pinned ci-lint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zackees/ci.yml
          ref: 54cec7ad3ac5c7b9866a1798b863c21e68936d60
          path: .ci-lint
          persist-credentials: false
      - name: Plan this run with the pinned ci-lint
        id: plan
        env:
          PYTHONPATH: .ci-lint
        run: >-
          uv run --no-project python -m ci_lint plan --repo .
          --event-name "${GITHUB_EVENT_NAME}" --sha "${{ steps.mode.outputs.sha }}" --github-output
      # forge-ci/ci.yml#95: precheck gates. Any ci-lint violation in the
      # workflows, ci.toml or the tree fails `linux`; `--live` adds the live
      # cache audit (actions: read through this job's token).
      - name: Precheck the repository with the pinned ci-lint
        env:
          PYTHONPATH: .ci-lint
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.3 python -m ci_lint precheck --repo . --live
      # Only full mode compiles the webview graph or drives a display. The
      # minimal and test graphs (`default = []`, `json`) link no GTK, WebKit or
      # soup library; `openssl-sys` in dev-dependencies uses the runner
      # image's libssl-dev, which this step never installed.
      - name: Install native webview packages and a virtual display
        if: steps.mode.outputs.mode == 'full'
        run: python3 ci/runner_setup.py apt-install dbus-x11 jq libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool
      # No restored crate registry here. This job compiles dozens of different
      # feature graphs, and a registry cache seeded by a job that needed only
      # part of the graph restores trimmed crate directories cargo trusts as
      # extracted: the first run on this shape failed all 36 feature checks at
      # `libc-0.2.189/src/unix/mod.rs: file not found`, from an 8,723-file
      # restore where the gate had restored 26,983. `dylints` guards against
      # the same thing with its own CARGO_HOME. Downloading sources costs a
      # minute; a poisoned registry costs the whole job.
      - name: Set up soldr
        uses: ./.github/actions/soldr # the one setup-soldr call site
        id: setup_soldr
        with:
          # The plan saves only on main pushes; PRs and manually selected
          # candidate SHAs restore without racing main retention or stranding
          # unreachable lock generations.
          save-cache-remote: ${{ steps.plan.outputs.cache_save }}
          cache-key-pr: ${{ steps.plan.outputs.cache_key_pr }}
          ci-tests: true
          cache-key-suffix: linux
          prebuild-deps-flags: ""
          cargo-registry-cache: false
      - name: Restore native pkg-config search path
        run: python3 ci/runner_setup.py pkg-config-path --target x86_64-unknown-linux-gnu
      - name: Check workspace formatting
        run: soldr cargo fmt --all -- --check
      - name: Check Python function complexity
        run: uv run --no-project --with ruff==0.16.7 ruff check .
      - name: Check the CI guards and the guest build scripts
        env:
          PYTHONPATH: .ci-lint
        # The module list lives in ci/linux_steps.py (CI_GUARD_MODULES).
        run: python3 ci/linux_steps.py ci-guards
      # The platform boundary (#152) is a source rule, so its repository scan
      # parses every enforced package's modules -- cfg-elided Windows and
      # macOS files included -- without compiling the product. That makes it
      # cheap enough to gate every mode; the `dylints` job adds the resolving
      # passes and the UI tests in full mode.
      - name: Scan the repository against the platform boundary
        env:
          CARGO_HOME: ${{ runner.temp }}/kernal-boundary-scan-cargo
        # The lint's own rust-toolchain.toml is the one Dylint nightly pin.
        # Deliberately NOT run from the lint crate: its .cargo/config.toml sets
        # `linker = dylint-link`, which this scan job does not install, so every
        # build script fails to link. The scan is plain lib unit tests and
        # needs no Dylint linker.
        run: python3 ci/linux_steps.py boundary-scan
      - name: Check the Dylint libraries' formatting
        run: python3 ci/linux_steps.py dylint-fmt
      - name: Lint the default facade
        if: steps.mode.outputs.mode != 'full'
        run: soldr cargo clippy --locked --lib -- --deny warnings
      - name: Test the default facade
        if: steps.mode.outputs.mode != 'full'
        # The build-ID assertion depends on the CI linker's note settings;
        # the full Nextest lane retains it on its existing all-feature graph.
        run: >-
          soldr cargo test --locked --lib --
          --skip platform_linux::tests::current_executable_exposes_a_gnu_build_id
      - name: Test the Linux desktop status facade
        if: steps.mode.outputs.mode != 'full'
        # --no-default-features --features system-tray --lib system_tray, then
        # --no-default-features --features system-tray --test terminal system_tray
        run: python3 ci/linux_steps.py desktop-status
      - name: Test the full Linux desktop status facade
        if: steps.mode.outputs.mode == 'full'
        # --all-features --lib system_tray, then --all-features --test terminal system_tray
        run: python3 ci/linux_steps.py desktop-status --full
      - name: Check the compilation boundary and the release tooling
        if: steps.mode.outputs.mode == 'full'
        run: python3 ci/linux_steps.py release-tooling
      - name: Test the Python package
        if: steps.mode.outputs.mode == 'full'
        # Python 3.10 only: it is the floor AGENTS.md supports, and the
        # package has no version-specific code for a second interpreter to
        # catch.
        run: python3 ci/linux_steps.py python-package
      # First compile in this job, deliberately. zccache restores a cached
      # build script without the materialize/spawn exclusion its miss path
      # has, so a busy daemon can fork a child that inherits the write fd
      # and the exec fails with ETXTBSY (zackees/zccache#1597). Run after the
      # 36 feature checks, this step hit it twice in a row; as a standalone
      # job, with a quiet daemon, it never did. This ordering is a
      # mitigation until #1597 is fixed, not a cure -- no job cap, no retry.
      - name: Verify checked-in guest, host, and ABI manifest generation
        if: steps.mode.outputs.mode == 'full'
        run: python3 ci/linux_steps.py abi-generation
      - name: Check every feature in isolation
        if: steps.mode.outputs.mode == 'full'
        # 36 isolated `cargo check`s, one step: ci/linux_steps.py ISOLATED_FEATURES.
        run: python3 ci/linux_steps.py feature-isolation
      - name: Test JSON with unified arbitrary-precision backend feature
        if: steps.mode.outputs.mode != 'minimal'
        run: >-
          soldr cargo test --locked --no-default-features
          --features json,serde_json/arbitrary_precision --test data
      - name: Verify HTTP wire semantics under backend feature unification
        if: steps.mode.outputs.mode == 'full'
        # Resolves a backend feature outside the production graph, so it may
        # update the lockfile and cannot run `--locked`.
        run: soldr cargo test --features http-client,reqwest/gzip --test net http_client::encoded_responses_preserve_wire_bytes_and_headers  # ci-lint: allow TOOL-002 resolves reqwest/gzip outside the production graph, so it cannot run --locked
      - name: Check the external facade consumers
        if: steps.mode.outputs.mode == 'full'
        run: python3 ci/linux_steps.py external-consumers
      - name: Run real semantic webview lifecycle and capture proofs
        if: steps.mode.outputs.mode == 'full'
        # A unit test does not own process main on every harness, while Tauri
        # needs its event loop there, so these run the smoke binary under Xvfb.
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: python3 ci/linux_steps.py webview-proofs
      - name: Install the screenshot guest target
        if: steps.mode.outputs.mode == 'full'
        run: uv run --no-project ci/native_proof.py wasm-target wasm32-wasip1-threads
      - name: Build, admit, and run the real guest through the default screenshot CLI
        if: steps.mode.outputs.mode == 'full'
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          KERNAL_API_SCREENSHOT_PROOF_DIR: ${{ runner.temp }}/kernal-api-screenshot-proof
        # The CLI starts Soldr itself; ci/linux_steps.py finishes the outer
        # Soldr invocation before running the harness.
        run: python3 ci/linux_steps.py screenshot-cli
      # The x86_64 Linux native proofs, built and run in place: here the
      # builder is the host. Every other target builds in `build` and runs in
      # `test`.
      # Built once: the x86_64 Linux native proofs below use them in place, and
      # every other host's `test` job downloads them.
      - name: Build the target-independent Wasm guests once
        if: steps.mode.outputs.mode == 'full'
        run: >-
          uv run --no-project ci/native_proof.py guests
          --out "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-guest-build"
      # v4 artifacts are immutable per name, and the fixed-name artifacts
      # below live one day. Without `overwrite`, a re-run of `linux` past
      # that expiry could neither republish native-proof-guests nor leave
      # the Test jobs anything to download: their download step failed,
      # and "Cancel the run" killed every attempt twice on #320. Every
      # fixed-name upload in this workflow overwrites so a rerun can
      # always refresh what its dependents need.
      - name: Upload target-independent Wasm guests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.mode.outputs.mode == 'full'
        with:
          name: native-proof-guests
          path: ${{ runner.temp }}/native-proof-guests
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Compile the x86_64 Linux native proofs
        if: steps.mode.outputs.mode == 'full'
        run: >-
          uv run --no-project ci/native_proof.py build --target x86_64-unknown-linux-gnu
          --archive "${{ runner.temp }}/native-proof-x86_64-unknown-linux-gnu.tar"
          --work "${{ runner.temp }}/native-proof-build"
      - name: Run the x86_64 Linux compiler-policy proofs
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 20
        run: >-
          uv run --no-project ci/native_proof.py run compiler
          --native-target x86_64-unknown-linux-gnu
          --bundle "${{ runner.temp }}/native-proof-x86_64-unknown-linux-gnu.tar"
          --guests "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-run-compiler"
      - name: Run the x86_64 Linux screenshot and containment proofs
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 30
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          KERNAL_API_SCREENSHOT_PROOF_DIR: ${{ runner.temp }}/kernal-api-screenshot-proof
        run: >-
          uv run --no-project ci/native_proof.py run screenshot
          --native-target x86_64-unknown-linux-gnu
          --bundle "${{ runner.temp }}/native-proof-x86_64-unknown-linux-gnu.tar"
          --guests "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-run-screenshot"
      - name: Lint every target
        if: steps.mode.outputs.mode == 'full'
        run: >-
          soldr cargo clippy
          --locked --all-features --all-targets -- --deny warnings
      - name: Run the full test suite
        if: steps.mode.outputs.mode == 'full'
        # One test per process. `--no-fail-fast` is about tests, not runners:
        # the suite is about thirty seconds of tests, so stopping at the first
        # failure saved no capacity and hid the rest until the next cycle.
        run: soldr cargo nextest run --locked --all-features --no-fail-fast
      - name: Preserve screenshot and process diagnostics
        if: always() && steps.mode.outputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-screenshot-diagnostics
          path: ${{ runner.temp }}/kernal-api-screenshot-proof
          if-no-files-found: warn
          overwrite: true
      # Last step: a failure anywhere in this job stops the whole run, so a
      # red push releases its runners instead of finishing jobs that no longer
      # matter. A step, not a sentinel job: a job that `needs` the others
      # starts only when all of them finish, which is too late to cancel
      # anything. Pull requests only: on main a cancelled run would erase the
      # record of which job failed.
      - name: Cancel the run (this job failed)
        if: failure() && github.event_name == 'pull_request' && steps.mode.outputs.mode != 'full'
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Every other target, compiled on Linux: the scarce Apple and Windows
  # runners in `test` only ever execute what these builders produce.
  build:
    name: Build (${{ matrix.target }})
    needs: linux
    if: needs.linux.outputs.mode == 'full'
    strategy:
      # Every target compiles the same sources; the second failure teaches
      # nothing the first did not.
      fail-fast: false
      matrix:
        include:
          # aarch64 Linux builds natively on an ARM runner, so WebKitGTK uses
          # the distribution's own ABI instead of a cross sysroot.
          - builder: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: ""
          - builder: ubuntu-24.04
            target: x86_64-apple-darwin
            cross: x86_64-apple-darwin
          - builder: ubuntu-24.04
            target: aarch64-apple-darwin
            cross: aarch64-apple-darwin
          - builder: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            cross: x86_64-pc-windows-msvc
          - builder: ubuntu-24.04
            target: aarch64-pc-windows-msvc
            cross: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.builder }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          ref: ${{ needs.linux.outputs.sha }}
      - name: Verify selected source SHA
        run: python3 ci/verify_source_sha.py "${{ needs.linux.outputs.sha }}"
      - name: Install native webview development packages
        if: matrix.cross == ''
        run: python3 ci/runner_setup.py apt-install libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: ./.github/actions/soldr # the one setup-soldr call site
        with:
          # The plan saves only on main pushes; PRs and manually selected
          # candidate SHAs restore without racing main retention or stranding
          # unreachable lock generations.
          save-cache-remote: ${{ needs.linux.outputs.cache_save }}
          cache-key-pr: ${{ needs.linux.outputs.cache_key_pr }}
          ci-tests: true
          cache-key-suffix: build-${{ matrix.target }}
          cross-targets: ${{ matrix.cross }}
          # Exact-main full run 36281990983 recorded 0 cook hits in all five
          # build targets; the five per-target cook bases totaled 11.31 GB.
          # Keep build-cache, prepared-state, registry and toolchain caches;
          # omitting only cook projects the settled family at 7–8.5 GB.
          prebuild-deps: none
          cargo-registry-cache: true
          prebuild-deps-flags: ${{ matrix.cross && format('--target {0}', matrix.cross) || '' }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          save-cache: ${{ needs.linux.outputs.cache_save }}
          cache-suffix: ${{ needs.linux.outputs.cache_key_pr }}
      # Every feature except host-only build-script facilities, derived from
      # Cargo.toml so a new feature is covered here automatically. This is a
      # graph linked for the TARGET; `build-resources` runs only in an
      # application's build script on the build host, and its embed-resource
      # -> vswhom-sys C++ archive is built only on a Windows host, so linking
      # it into kernal-api's own test binaries from a Linux cross builder
      # fails with undefined `vswhom_*` symbols. `build-resources` stays
      # covered by the per-feature isolation check and by
      # tests/build-resources-consumer, checked natively in `linux` and for
      # each Windows target below. ci/native_proof.py reads the same variable,
      # so its `all` graph remains the one this job's archive already built.
      - name: Select the target feature graph
        run: uv run --no-project --python 3.12 ci/target_features.py --github-env
      - name: Restore native pkg-config search path
        if: matrix.cross == ''
        run: python3 ci/runner_setup.py pkg-config-path --target "${{ matrix.target }}"
      # A native lane (`cross` empty) builds for the host WITHOUT `--target`:
      # naming the triple makes Soldr link through a zig shim the runner does
      # not carry. Clippy never links, so only the archive would notice.
      - name: Lint this target
        env:
          CROSS_TARGET_ARGS: ${{ matrix.cross && format('--target {0}', matrix.cross) || '' }}
        run: >-
          soldr cargo clippy
          --locked --features "${KERNAL_TARGET_FEATURES}" --all-targets
          ${CROSS_TARGET_ARGS}
          -- --deny warnings
      # Windows keeps debug info in a `.pdb` beside the `.exe`, and nextest
      # archives the executable without it; `kernal-symbolize`'s tests read
      # their own binary's PDB. `archive.include` takes paths, not globs, and
      # the name carries a build hash, so build first, name the PDB, archive
      # with it. Only that one: `deps` is half a gigabyte for one binary.
      - name: Archive every test binary for this target
        run: python3 ci/build_steps.py archive --target "${{ matrix.target }}" --cross "${{ matrix.cross }}"
      - name: Compile the explicit ABI generator for this target
        # The one check `supported-targets` made that the archive does not.
        env:
          CROSS_TARGET_ARGS: ${{ matrix.cross && format('--target {0}', matrix.cross) || '' }}
        run: >-
          soldr cargo check --locked
          --manifest-path tools/wasm-abi-generator/Cargo.toml
          ${CROSS_TARGET_ARGS}
      # `build-resources` as it is meant to run: in an application's build
      # script on this (Linux) host, compiling resources for the Windows
      # target. The target graph above excludes it; this is its coverage.
      #
      # embed-resource invokes `llvm-rc` for an MSVC target and reads the
      # documented `RC_<target>` override, which is how a host that carries
      # only versioned LLVM binaries (this runner) names its own. Resolve one
      # rather than assume the plain name is on PATH; failing to compile
      # resources must stay a real failure, so nothing here is skipped.
      - name: Embed Windows resources through the build-resources consumer
        if: endsWith(matrix.target, '-pc-windows-msvc')
        run: python3 ci/build_steps.py embed-resources --target "${{ matrix.target }}"
      - name: Build the native webview smoke binary
        if: endsWith(matrix.target, '-pc-windows-msvc') || endsWith(matrix.target, '-apple-darwin')
        run: >-
          soldr cargo build
          --locked --features "${KERNAL_TARGET_FEATURES}" --target ${{ matrix.target }}
          --bin kernal-tauri-smoke
      - name: Compile every native proof binary for this target
        run: >-
          uv run --no-project ci/native_proof.py build --target ${{ matrix.target }}
          --archive "${{ runner.temp }}/native-proof-${{ matrix.target }}.tar"
          --work "${{ runner.temp }}/native-proof-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernal-tests-${{ matrix.target }}
          path: |
            kernal-tests-${{ matrix.target }}.tar.zst
            target/${{ matrix.target }}/debug/kernal-tauri-smoke.exe
            target/${{ matrix.target }}/debug/kernal-tauri-smoke
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-proof-${{ matrix.target }}
          path: ${{ runner.temp }}/native-proof-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      # Stops the whole run on a failure here; see the step in `linux`.
      - name: Cancel the run (this job failed)
        if: failure() && github.event_name == 'pull_request' && needs.linux.outputs.mode != 'full'
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Run each target's prebuilt binaries on its own host. Nothing here compiles.
  test:
    name: Test (${{ matrix.target }})
    needs: [linux, build]
    if: needs.linux.outputs.mode == 'full'
    strategy:
      # One host's failure stops the others; a host-specific failure is
      # reproduced by re-running this job alone.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          ref: ${{ needs.linux.outputs.sha }}
      # Before any script step: every host runs ci/*.py through uv's Python.
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          save-cache: ${{ needs.linux.outputs.cache_save }}
          cache-suffix: ${{ needs.linux.outputs.cache_key_pr }}
      - name: Verify selected source SHA
        run: uv run --no-project --python 3.12 ci/verify_source_sha.py "${{ needs.linux.outputs.sha }}"
      - name: Install the native webview runtime and a virtual display
        # The binaries link webkit2gtk at run time, and the screenshot proofs
        # need a display. Windows and macOS carry their webviews with the OS.
        if: runner.os == 'Linux'
        run: uv run --no-project --python 3.12 ci/runner_setup.py apt-install dbus-x11 libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kernal-tests-${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-proof-guests
          path: ${{ runner.temp }}/native-proof-guests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-proof-${{ matrix.target }}
          path: ${{ runner.temp }}/native-proof-bundle
      - name: Install cargo-nextest
        # ci/runner_setup.py NEXTEST_ASSETS selects a pinned GitHub release
        # by "${{ runner.os }}-${{ runner.arch }}" and checks its SHA-256.
        # ci/build_steps.py asserts the archive producer uses the same release.
        run: uv run --no-project --python 3.12 ci/runner_setup.py nextest-install
      # The runner's volumes are NTFS, which cannot share blocks. Format a
      # ReFS volume so the Windows extent-sharing tests prove block-clone
      # reference counts rather than skip (KERNAL_REFS_TEST_DIR).
      - name: Mount a ReFS volume for extent-sharing tests
        if: matrix.os == 'windows-2025'
        run: uv run --no-project --python 3.12 ci/runner_setup.py refs-volume
      - name: Run this host's prebuilt tests
        run: uv run --no-project --python 3.12 ci/host_steps.py run-tests --target "${{ matrix.target }}"
      - name: Prove this host ran its own code
        # Fails "did not execute its own code" when no platform_<os>:: test ran.
        run: uv run --no-project --python 3.12 ci/host_steps.py prove-own-code
      - name: Run actual Core and Component compiler-policy guest proofs
        timeout-minutes: 20
        shell: bash
        run: >-
          uv run --no-project ci/native_proof.py run compiler
          --native-target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-proof-bundle/native-proof-${{ matrix.target }}.tar"
          --guests "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-run-compiler"
      - name: Configure screenshot proof storage
        run: uv run --no-project --python 3.12 ci/runner_setup.py screenshot-storage
      - name: Ensure Windows WebView2 Runtime
        if: runner.os == 'Windows'
        run: uv run --no-project --python 3.12 ci/runner_setup.py webview2
      - name: Run offline native Wasm screenshot, admission, and worker containment proofs
        timeout-minutes: 30
        shell: bash
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: >-
          uv run --no-project ci/native_proof.py run screenshot
          --native-target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-proof-bundle/native-proof-${{ matrix.target }}.tar"
          --guests "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-run-screenshot"
      # The WebView2 proofs need a real Windows host, from a binary built on
      # Linux (#270, #273).
      - name: Verify native Windows external-page isolation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: target/x86_64-pc-windows-msvc/debug/kernal-tauri-smoke.exe close
      - name: Verify native Windows page bootstrap
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: target/x86_64-pc-windows-msvc/debug/kernal-tauri-smoke.exe bootstrap
      - name: Verify native Windows interactive window lifetime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: target/x86_64-pc-windows-msvc/debug/kernal-tauri-smoke.exe window-close
      - name: Verify native Windows widget window controls
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: target/x86_64-pc-windows-msvc/debug/kernal-tauri-smoke.exe widget
      # AppKit proof of the same controls (keep-above level, accessory
      # activation policy, placement, navigate), from the Linux-built binary.
      - name: Verify native macOS widget window controls
        if: runner.os == 'macOS'
        shell: bash
        run: uv run --no-project --python 3.12 ci/host_steps.py macos-widget --target "${{ matrix.target }}"
      - name: Preserve screenshot and process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/kernal-api-screenshot-proof
          if-no-files-found: warn
          overwrite: true
      # Stops the whole run on a failure here; see the step in `linux`.
      - name: Cancel the run (this job failed)
        if: failure() && github.event_name == 'pull_request' && needs.linux.outputs.mode != 'full'
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # One cached Linux pass runs both custom Dylints for ordinary PRs.
  # Starts beside `linux`, not after it: it is one Linux runner, so a red
  # `linux` costs nothing scarce, and waiting added the gate's ~2.3 min to
  # the PR critical path. It selects its own mode and SHA the same way.
  dylints:
    needs: verify
    # GEN-022 step 6: `dylint-cache-writer` runs the push-time Dylint pass.
    if: needs.verify.outputs.skip_dylints != 'true' && github.event_name != 'push'
    name: Dylint workspace
    env:
      DYLINT_TOOLCHAIN: nightly-2026-05-28
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # The webview headers are needed only once something compiles, and the
      # install shares nothing with setup-soldr. Start it right after checkout
      # in the background (a step's background process lives until the job
      # ends) and wait for it before the lint step: it overlaps setup-soldr's
      # ~40 s instead of adding its own 22-46 s to the critical path. Bounded
      # mirror retries/timeouts: a stalled connection otherwise hangs apt.
      - name: Start installing native webview development packages
        run: python3 ci/runner_setup.py apt-start libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # Before the plan exists: only a main push saves (ci.toml [cache].write-on).
          save-cache: ${{ github.event_name == 'push' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Select CI mode and verify the checked-out commit
        id: mode
        run: uv run --no-project --python 3.12 ci/ci_mode.py
      - name: Verify selected source SHA
        run: python3 ci/verify_source_sha.py "${{ steps.mode.outputs.sha }}"
      # Runs beside `linux`, so it plans its own cache saves the same way.
      - name: Checkout pinned ci-lint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zackees/ci.yml
          ref: 54cec7ad3ac5c7b9866a1798b863c21e68936d60
          path: .ci-lint
          persist-credentials: false
      - name: Plan this run with the pinned ci-lint
        id: plan
        env:
          PYTHONPATH: .ci-lint
        run: >-
          uv run --no-project python -m ci_lint plan --repo .
          --event-name "${GITHUB_EVENT_NAME}" --sha "${{ steps.mode.outputs.sha }}" --github-output
      - name: Set up soldr
        uses: ./.github/actions/soldr # the one setup-soldr call site
        with:
          # The plan saves only on main pushes; PRs and manually selected
          # candidate SHAs restore without racing main retention or stranding
          # unreachable lock generations.
          save-cache-remote: ${{ steps.plan.outputs.cache_save }}
          cache-key-pr: ${{ steps.plan.outputs.cache_key_pr }}
          toolchain: 1.95.0
          cache: true
          build-cache: false
          prebuild-deps: none
          dylint: true
          # Every compiling step below sets its own CARGO_HOME (a partially
          # restored registry is not trusted), so a restored ~/.cargo registry
          # is never read. Extracting its 29k files was the slowest parallel
          # restore (~41 s) and set this step's wall time.
          cargo-registry-cache: false
          dylint-toolchain: ${{ env.DYLINT_TOOLCHAIN }}
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
      - name: Restore native pkg-config search path
        run: echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      - name: Select the pinned Dylint compiler
        # RUSTC=$(soldr rustup which --toolchain "$DYLINT_TOOLCHAIN" rustc),
        # RUSTUP_TOOLCHAIN, and ci/dylint-shim first on PATH.
        run: python3 ci/dylint_steps.py select-compiler
      # The lint libraries' own suites (UI + unit tests) depend only on
      # `dylints/**`; the platform lint's repository scan already runs in
      # `linux`. Each suite is a ~70 s uncached nightly compile, so an
      # ordinary PR that leaves the lints alone skips them. Main pushes, full
      # mode, and any PR touching the lints, their shim, or this workflow run
      # them. A stale base only widens the diff, so it errs toward running.
      - name: Decide whether the lint libraries need their own tests
        id: lint_libs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 ci/dylint_steps.py lint-libs-decision --mode "${{ steps.mode.outputs.mode }}"
      - name: Finish installing native webview development packages
        timeout-minutes: 10
        run: python3 ci/runner_setup.py apt-finish
      # A Dylint pass only sees what the compiler compiles, and `default = []`.
      # Without `--all-features` every gated module -- `crash`, `wasm`,
      # `symbolize`, `profile`, `fs`, `ipc`, the platform watchers -- is invisible
      # to the boundary lints, so a green job would mean nothing beyond the
      # ungated core. Keep both flags: features widen the module set, targets
      # widen it to the integration tests and the two worker binaries.
      #
      # When they run, the two lint libraries' own test suites and the
      # workspace pass share no target directory, so they run concurrently: sequentially they were
      # ~70 s of this job's ~3.5 min critical path. Each lane logs to its own
      # file, printed in a group once all three finish, and every failing
      # lane is named.
      - name: Verify nightly checksum invalidation
        run: uv run --no-project --python 3.12 python ci/dylint_freshness.py
      - name: Lint every client-style target
        env:
          # Do not trust a partially restored global crates.io source tree.
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
          RUN_LINT_LIBRARY_TESTS: ${{ steps.lint_libs.outputs.run }}
        # `soldr cargo dylint --all --workspace -- --all-features --all-targets`,
        # plus the lint libraries' suites when they run: ci/dylint_steps.py.
        run: python3 ci/dylint_steps.py lanes
      # Stops a minimal PR run on a failure here; full runs report every leg.
      - name: Cancel the run (this job failed)
        if: failure() && github.event_name == 'pull_request' && steps.mode.outputs.mode != 'full'
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # GEN-022 step 5 (forge-ci/ci.yml#432): push-only cache writers. The merge
  # queue already validated the tree that lands, so these compile without
  # gating anything and are never required checks. They save the same keys
  # PR runs of `linux` and `dylints` restore: identical setup-soldr inputs
  # (suffix, ci-tests, cook flags, Dylint toolchain). Main is the only remote
  # writer (ci.toml [cache].write-on), and main pushes never cancel
  # (CACHE-016), so a writer's save is not lost to a newer push.
  linux-cache-writer:
    name: Cache writer (linux)
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      soldr_version: ${{ steps.setup_soldr.outputs.soldr-version }}
      cache_save: ${{ steps.plan.outputs.cache_save }}
      cache_key_pr: ${{ steps.plan.outputs.cache_key_pr }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          save-cache: ${{ github.event_name == 'push' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Select CI mode and verify the checked-out commit
        id: mode
        run: uv run --no-project --python 3.12 ci/ci_mode.py
      - name: Checkout pinned ci-lint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zackees/ci.yml
          ref: 54cec7ad3ac5c7b9866a1798b863c21e68936d60
          path: .ci-lint
          persist-credentials: false
      - name: Plan this run with the pinned ci-lint
        id: plan
        env:
          PYTHONPATH: .ci-lint
        run: >-
          uv run --no-project python -m ci_lint plan --repo .
          --event-name "${GITHUB_EVENT_NAME}" --sha "${{ steps.mode.outputs.sha }}" --github-output
      - name: Set up soldr
        uses: ./.github/actions/soldr # the one setup-soldr call site
        id: setup_soldr
        with:
          # Same inputs as `linux`, so PRs restore what this job saves.
          save-cache-remote: ${{ steps.plan.outputs.cache_save }}
          cache-key-pr: ${{ steps.plan.outputs.cache_key_pr }}
          ci-tests: true
          cache-key-suffix: linux
          prebuild-deps-flags: ""
          cargo-registry-cache: false
      - name: Restore native pkg-config search path
        run: python3 ci/runner_setup.py pkg-config-path --target x86_64-unknown-linux-gnu
      # Build-only: the default facade's clippy pass and its test binaries,
      # compiled not run -- the compile surface every minimal PR `linux` run
      # restores. Execution is validation, which stays with the queue.
      - name: Compile the default facade lint
        run: soldr cargo clippy --locked --lib -- --deny warnings
      - name: Compile the default facade tests without running them
        run: soldr cargo test --locked --lib --no-run

  # The Dylint output cache's only writer is main (CACHE-016), and a Dylint
  # output is produced only by a full pass, so this writer runs the same
  # lanes as `dylints`.
  dylint-cache-writer:
    name: Cache writer (Dylint)
    needs: verify
    if: github.event_name == 'push'
    env:
      DYLINT_TOOLCHAIN: nightly-2026-05-28
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Start installing native webview development packages
        run: python3 ci/runner_setup.py apt-start libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          save-cache: ${{ github.event_name == 'push' }}
          cache-suffix: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
      - name: Select CI mode and verify the checked-out commit
        id: mode
        run: uv run --no-project --python 3.12 ci/ci_mode.py
      - name: Checkout pinned ci-lint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zackees/ci.yml
          ref: 54cec7ad3ac5c7b9866a1798b863c21e68936d60
          path: .ci-lint
          persist-credentials: false
      - name: Plan this run with the pinned ci-lint
        id: plan
        env:
          PYTHONPATH: .ci-lint
        run: >-
          uv run --no-project python -m ci_lint plan --repo .
          --event-name "${GITHUB_EVENT_NAME}" --sha "${{ steps.mode.outputs.sha }}" --github-output
      - name: Set up soldr
        uses: ./.github/actions/soldr # the one setup-soldr call site
        with:
          # Same inputs as `dylints`, so PRs restore what this job saves.
          save-cache-remote: ${{ steps.plan.outputs.cache_save }}
          cache-key-pr: ${{ steps.plan.outputs.cache_key_pr }}
          toolchain: 1.95.0
          cache: true
          build-cache: false
          prebuild-deps: none
          dylint: true
          cargo-registry-cache: false
          dylint-toolchain: ${{ env.DYLINT_TOOLCHAIN }}
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
      - name: Restore native pkg-config search path
        run: python3 ci/runner_setup.py pkg-config-path --target x86_64-unknown-linux-gnu
      - name: Select the pinned Dylint compiler
        run: python3 ci/dylint_steps.py select-compiler
      - name: Decide whether the lint libraries need their own tests
        id: lint_libs
        run: python3 ci/dylint_steps.py lint-libs-decision --mode "${{ steps.mode.outputs.mode }}"
      - name: Finish installing native webview development packages
        timeout-minutes: 10
        run: python3 ci/runner_setup.py apt-finish
      - name: Lint every client-style target
        env:
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
          RUN_LINT_LIBRARY_TESTS: ${{ steps.lint_libs.outputs.run }}
        run: python3 ci/dylint_steps.py lanes

  full-coverage:
    name: Full coverage
    needs: [linux, build, test, dylints]
    if: ${{ always() && needs.linux.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.linux.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          save-cache: ${{ needs.linux.outputs.cache_save }}
          cache-suffix: ${{ needs.linux.outputs.cache_key_pr }}
      - name: Verify complete full-mode coverage
        env:
          EXPECTED_SHA: ${{ needs.linux.outputs.sha }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 ci/full_coverage.py

  # setup-soldr cook bases restore exact-only and include the runtime Soldr
  # version in the key. After every producer job has completed its post-step,
  # retire old Soldr versions, superseded lock-scoped entries with an exact
  # same-shape replacement, and the five explicitly disabled cross-target
  # cook shapes. Preserve the active native xlinux cook. Under budget pressure,
  # retire older-lock Dylint outputs in LRU order while preserving current-lock
  # outputs and a nonempty current-lock anchor on the same architecture.
  cache-retention:
    name: Retire superseded and disabled cache generations
    needs: [linux, build, test, dylints, full-coverage, linux-cache-writer, dylint-cache-writer]
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs['linux-cache-writer'].result == 'success' &&
        needs['dylint-cache-writer'].result == 'success' &&
        (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
        (needs.build.result == 'success' || needs.build.result == 'skipped') &&
        (needs.test.result == 'success' || needs.test.result == 'skipped') &&
        (needs.dylints.result == 'success' || needs.dylints.result == 'skipped') &&
        (needs['full-coverage'].result == 'success' || needs['full-coverage'].result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          save-cache: ${{ needs['linux-cache-writer'].outputs.cache_save }}
          cache-suffix: ${{ needs['linux-cache-writer'].outputs.cache_key_pr }}
      - name: Retire obsolete or disabled cook bases and enforce the live cache budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOLDR_VERSION: ${{ needs['linux-cache-writer'].outputs.soldr_version }}
        run: >-
          uv run --no-project ci/prune_obsolete_cook_caches.py
          --version "${SOLDR_VERSION}" --apply

  # GEN-022 (forge-ci/ci.yml#405): every queue run and main push ends with the
  # ci-lint cache janitor. It runs after every other job, even failed ones, so
  # the repository stays under [cache].budget by our LRU order instead of
  # GitHub's, which can evict a seed a required job restores. The queue
  # serializes default-branch cache writes; the non-cancelling group keeps one
  # sweep at a time across runs.
  cache-janitor:
    name: Cache janitor
    needs: [verify, fast, linux, build, test, dylints, linux-cache-writer, dylint-cache-writer, full-coverage, cache-retention]
    if: always() && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: cache-janitor
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout pinned ci-lint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zackees/ci.yml
          ref: 54cec7ad3ac5c7b9866a1798b863c21e68936d60
          path: .ci-lint
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          save-cache: false
      - name: Evict down to the cache budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .ci-lint
        run: uv run --no-project --python 3.12 python -m ci_lint cache janitor --repo .
