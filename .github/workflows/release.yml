name: Release

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
      full_ci_run_id:
        required: false
        type: string
    secrets:
      PYPI_API_TOKEN:
        required: false

# Read-only by default (ci-lint SEC-002). Every job grants itself
# `actions: write` so a failed job can cancel the rest of the release, and
# `release-assets` also `contents: write`; ci.toml's [allow].permissions lists
# exactly those jobs.
permissions:
  contents: read
  actions: read

# One release per tag. Not the caller's `kernal-api-release` group: a called
# workflow sharing its caller's group would wait on the caller forever.
concurrency:
  group: kernal-api-release-call-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "0"

jobs:
  release-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          lfs: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # Release runs never write caches (ci.toml [cache].write-on = main).
          save-cache: false
      - name: Verify immutable release source and tag
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run --no-project --python 3.13 ci/auto_release.py --verify-source
      - name: Verify exact-SHA full CI before any publication
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.source_sha }}
          FULL_CI_RUN_ID: ${{ inputs.full_ci_run_id }}
        run: uv run --no-project --python 3.12 ci/release_ci_gate.py
      - name: Reject migration-only running-process paths
        run: >-
          uv run --no-project --with tomli==2.2.1 python
          ci/check_release_process_substrate.py
      # A failed release job stops the whole release run.
      - name: Cancel the run (this job failed)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  validate-and-package:
    needs: release-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      actions: write
    # Matches `linux` in ci.yml so this job's cook base is that job's (#355):
    # the same target, dev profile and suffix restore one ~2.4 GB base
    # instead of storing a second, `--release` one no step here compiles.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          lfs: true
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # Release runs never write caches (ci.toml [cache].write-on = main).
          save-cache: false
      # Restore the exact main CI generation to keep release validation warm,
      # but never save here: this separate workflow can race main's post-
      # producer retention job with an older candidate lockfile. Its package
      # and test outputs do not need durable caches.
      - uses: ./.github/actions/soldr # the one setup-soldr call site
        with:
          # Restore only; don't race the main retention job with an old lock.
          save-cache: "false"
          cache-key-suffix: linux
          prebuild-deps-flags: ""
      - name: Install native webview development packages
        run: python3 ci/runner_setup.py apt-install libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Restore native pkg-config search path
        run: python3 ci/runner_setup.py pkg-config-path --target x86_64-unknown-linux-gnu
      - name: Verify exact release version
        run: python3 ci/release_steps.py verify-version --tag "${{ inputs.tag }}"
      - name: Build and stage ConPTY sidecars
        # ci/build_conpty_assets.py, ci/verify_conpty_assets.py target/conpty-assets,
        # then cp target/conpty-assets/conpty-sidecar.sha256.toml conpty-sidecar.sha256.toml
        run: python3 ci/release_steps.py conpty
      - name: Test every facility together
        run: soldr cargo test --locked --all-features
      - name: Package exact Rust source
        # Registry consumers do not inherit this checkout's Git patches. Check
        # the extracted package with every advertised feature before publishing.
        # The generated sidecar manifest is the verified release input.
        # Allow exactly that staged release input into the package, then hold
        # the .crate to source only and crates.io's 10 MiB cap.
        run: uv run --no-project --python 3.12 ci/crate_release.py package
      - name: Package exact Python companion
        run: uv build --clear
      - run: uv run --no-project --with twine twine check dist/*
      - name: Stage flat registry artifacts
        run: python3 ci/release_steps.py stage-registry
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-packages
          path: registry-packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conpty-sidecars
          path: |
            target/conpty-assets/conpty-sidecar-*.tar.zst
            target/conpty-assets/conpty-sidecar.sha256.toml
          if-no-files-found: error
      # A failed release job stops the whole release run.
      - name: Cancel the run (this job failed)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  symbolizer-workers:
    needs: release-guard
    strategy:
      # One failed worker fails the release; stop its siblings at once.
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
          - target: aarch64-unknown-linux-gnu
            extension: ""
          # The Apple workers cross-compile on Linux through Soldr's bundled
          # LLVM and managed macOS SDK, exactly as CI's `supported-targets`
          # builds its Apple lanes. No Apple-hosted runner is used and the
          # release still ships both darwin workers.
          - target: x86_64-apple-darwin
            extension: ""
            cross: true
          - target: aarch64-apple-darwin
            extension: ""
            cross: true
          # The Windows workers cross-compile on Linux too, through Soldr's
          # managed xwin sysroot, as CI's `build` job does (#273).
          - target: x86_64-pc-windows-msvc
            extension: .exe
            cross: true
          - target: aarch64-pc-windows-msvc
            extension: .exe
            cross: true
    # Every worker builds on Linux; the Apple and Windows ones cross-compile.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/soldr # the one setup-soldr call site
        with:
          # No durable saves from pull requests (setup-soldr#527, #355).
          save-cache: "false"
          # Shipped binaries restore nothing. Every cache is a key another job
          # can write -- the v0.1.14 aarch64 worker restored a toolchain whose
          # rustup records listed an aarch64 std that the saved archive did not
          # contain, and failed at E0463. Build from sources and releases only.
          cache: false
          build-cache: false
          # Not covered by `cache: false`: the toolchain cache is separate.
          solo-toolchain-cache: false
          # The Apple and Windows workers need Soldr's managed SDK or sysroot
          # prepared up front.
          cross-targets: ${{ matrix.cross && matrix.target || '' }}
      - name: Build isolated worker
        run: >-
          soldr build
          --release --target ${{ matrix.target }} --features symbolize-worker
          --bin kernal-symbolize
      - name: Stage worker asset
        run: python3 ci/release_steps.py stage-worker --target "${{ matrix.target }}" --extension "${{ matrix.extension }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbolizer-${{ matrix.target }}
          path: release-worker/*
          if-no-files-found: error
      # A failed release job stops the whole release run.
      - name: Cancel the run (this job failed)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publish-pypi:
    if: ${{ !inputs.dry_run && vars.PUBLISH_PYPI == 'true' }}
    needs: [validate-and-package, release-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: write
    steps:
      # The step logic lives in ci/release_steps.py (GEN-005).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          # Release runs never write caches (ci.toml [cache].write-on = main).
          save-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-packages
          path: release-packages
      - name: Publish or verify identical PyPI artifacts
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # 404: upload; 200: every staged file must match PyPI's sha256; else fail.
        run: python3 ci/release_steps.py publish-pypi --tag "${{ inputs.tag }}"
      # A failed release job stops the whole release run.
      - name: Cancel the run (this job failed)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  release-assets:
    if: ${{ !inputs.dry_run }}
    needs: [validate-and-package, symbolizer-workers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Creates the GitHub release.
    permissions:
      contents: write
      actions: write
    steps:
      # The step logic lives in ci/release_steps.py (GEN-005).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: python3 ci/release_steps.py release-assets
      # A failed release job stops the whole release run.
      - name: Cancel the run (this job failed)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
