[stack.linux]
dockerfile = "docker/bosn.Dockerfile"
family = "kernal-api-linux"
default = true
workdir = "/repo"

[stack.linux.env]
CARGO_TARGET_DIR = "/target"
# No CARGO_BUILD_JOBS/SOLDR_JOBS cap (#29): soldr's in-daemon admission compiles
# amalgamation-sized units (Wasmtime/Cranelift, kernal_api) alone and picks a
# topology-aware width for the rest, as CI has relied on since #320.

[stack.linux.mounts]
repo = { source = ".", destination = "/repo", readonly = true }

[stack.linux.volumes]
target = { scope = "stack", destination = "/target" }
cargo-home = { scope = "machine", destination = "/usr/local/cargo" }
rustup-home = { scope = "machine", destination = "/usr/local/rustup" }
soldr-home = { scope = "machine", destination = "/root/.soldr" }

# No fmt/lint task: lint never runs under bosn. Run `soldr lint` on the host
# (`python ci/local_gate.py --job lint` for the gate's full lint lane).

[task.test]
stack = "linux"
cmd = "soldr cargo test --locked --all-features"

[task.threaded-smoke-red]
stack = "linux"
cmd = "python3 scripts/build_threaded_smoke.py"

[task.package]
stack = "linux"
cmd = "soldr cargo package --locked"
